name: Windows build

on:
  push:
    branches: [main, 'redesign/**']
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  host-checks:
    # Portable unit tests and a cross-compile check. Catches build and logic errors quickly; does not run Peek.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y g++-mingw-w64-x86-64-posix
      - name: Select the posix-threads compiler (std::thread needs it)
        run: |
          sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix
          sudo update-alternatives --set x86_64-w64-mingw32-gcc /usr/bin/x86_64-w64-mingw32-gcc-posix
      - name: Unit tests
        run: bash tests/run.sh
      - name: Cross-compile
        run: bash scripts/dev/crosscheck.sh x64 release

  build-x64:
    runs-on: windows-2022
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install MinGW-w64 GCC
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc
          path-type: inherit

      - name: Build
        shell: msys2 {0}
        run: cmd //c build.bat x64 release

      - name: Run self-test
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/ci-smoke.ps1 -Exe ./build/x64/Peek.exe

      - name: Prepare artifact
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifact | Out-Null
          Copy-Item build/x64/Peek.exe artifact/Peek.exe
          $hash = (Get-FileHash artifact/Peek.exe -Algorithm SHA256).Hash
          "$hash  Peek.exe" | Set-Content artifact/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Peek-windows-x64
          path: artifact/*
          if-no-files-found: error
